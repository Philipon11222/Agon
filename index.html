<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простий інтернет-магазин</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>TechStore</h1>
        <div class="cart-icon" onclick="toggleCart()">
            🛒 Кошик (<span id="cart-count">0</span>)
        </div>
    </header>

    <main>
        <h2>Наші товари</h2>
        <div class="products" id="product-list">
            <!-- Товари додаються через JS -->
        </div>
    </main>

    <!-- Модальне вікно кошика -->
    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="toggleCart()">&times;</span>
            <h2>Ваше замовлення</h2>
            <ul id="cart-items">
                <!-- Товари в кошику -->
            </ul>
            <p><strong>Загальна сума: <span id="cart-total">0</span> грн</strong></p>
            
            <h3>Оформлення замовлення</h3>
            <!-- Поля введення інформації -->
            <form id="order-form" onsubmit="placeOrder(event)">
                <input type="text" id="customer-name" placeholder="Ваше ім'я" required>
                <input type="tel" id="customer-phone" placeholder="Номер телефону" required>
                <input type="email" id="customer-email" placeholder="Email" required>
                <textarea id="customer-address" placeholder="Адреса доставки" required></textarea>
                <button type="submit">Оформити замовлення</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
